<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
        }

        .flag {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .currency-menu {
            display: flex;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 5px;
            margin-bottom: 25px;
            gap: 5px;
        }

        .currency-btn {
            flex: 1;
            padding: 12px 8px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #666;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .currency-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .currency-btn:hover:not(.active) {
            background: #e9ecef;
        }

        .currency-flag {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .currency-code {
            font-size: 11px;
            opacity: 0.8;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 18px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .conversion-display {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .conversion-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
        }

        .conversion-row:last-child {
            margin-bottom: 0;
        }

        .currency-amount {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 600;
        }

        .currency-amount.main {
            font-size: 24px;
        }

        .currency-symbol {
            font-size: 16px;
            opacity: 0.9;
        }

        .arrow {
            font-size: 20px;
            opacity: 0.8;
        }

        .rate-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }

        .loading {
            color: #667eea;
            font-style: italic;
        }

        .error {
            background: #ffe6e6;
            border: 1px solid #ffb3b3;
            color: #cc0000;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin-bottom: 15px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .footer {
            font-size: 12px;
            color: #999;
            margin-top: 15px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .currency-amount.main {
                font-size: 20px;
            }
            
            .currency-amount {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="flag">💱</div>
            <h1>Currency Converter</h1>
            <div class="subtitle">Latin America to USD</div>
        </div>

        <div class="currency-menu">
            <button class="currency-btn active" data-currency="COP" onclick="switchCurrency('COP')">
                <div class="currency-flag">🇨🇴</div>
                <div>Colombian</div>
                <div class="currency-code">COP</div>
            </button>
            <button class="currency-btn" data-currency="PEN" onclick="switchCurrency('PEN')">
                <div class="currency-flag">🇵🇪</div>
                <div>Peruvian</div>
                <div class="currency-code">PEN</div>
            </button>
        </div>

        <div class="input-group">
            <label for="amountInput" id="inputLabel">Colombian Pesos (COP)</label>
            <input 
                type="number" 
                id="amountInput" 
                placeholder="Enter amount..."
                min="0"
                step="0.01"
            >
        </div>

        <div class="conversion-display">
            <div class="conversion-row">
                <div class="currency-amount main">
                    <span class="currency-symbol" id="fromSymbol">🇨🇴</span>
                    <span id="fromAmount">0</span>
                </div>
                <div class="arrow">→</div>
                <div class="currency-amount main">
                    <span class="currency-symbol">🇺🇸</span>
                    <span id="toAmount">$0.00</span>
                </div>
            </div>
        </div>

        <div class="rate-info" id="rateInfo">
            <div class="loading">Loading exchange rates...</div>
        </div>

        <button class="refresh-btn" onclick="fetchExchangeRates()">🔄 Refresh Rates</button>
        
        <div class="footer">
            Tap any amount to add to home screen
        </div>
    </div>

    <script>
        let currentCurrency = 'COP';
        let exchangeRates = {
            COP: 0,
            PEN: 0
        };
        let lastUpdated = null;

        const amountInput = document.getElementById('amountInput');
        const inputLabel = document.getElementById('inputLabel');
        const fromSymbol = document.getElementById('fromSymbol');
        const fromAmount = document.getElementById('fromAmount');
        const toAmount = document.getElementById('toAmount');
        const rateInfo = document.getElementById('rateInfo');

        const currencies = {
            COP: {
                name: 'Colombian Pesos',
                symbol: '🇨🇴',
                code: 'COP',
                fallbackRate: 3200
            },
            PEN: {
                name: 'Peruvian Soles',
                symbol: '🇵🇪', 
                code: 'PEN',
                fallbackRate: 3.37
            }
        };

        // Switch currency
        function switchCurrency(currency) {
            currentCurrency = currency;
            
            // Update button states
            document.querySelectorAll('.currency-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-currency="${currency}"]`).classList.add('active');
            
            // Update labels and symbols
            const curr = currencies[currency];
            inputLabel.textContent = `${curr.name} (${curr.code})`;
            fromSymbol.textContent = curr.symbol;
            amountInput.placeholder = `Enter amount in ${curr.code}...`;
            
            // Update conversion and rate display
            convertCurrency();
            updateRateDisplay();
        }

        // Fetch exchange rates from multiple APIs
        async function fetchExchangeRates() {
            try {
                rateInfo.innerHTML = '<div class="loading">Loading exchange rates...</div>';
                
                let data;
                let apiUsed = 'estimated';
                
                // Free sources with no API key, tried in order.
                // (exchangerate.host now requires an access_key, so it always failed
                // and the app silently used the hardcoded fallback rate.)
                const sources = [
                    {
                        url: 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json',
                        pick: d => d.usd && { COP: d.usd.cop, PEN: d.usd.pen }
                    },
                    {
                        url: 'https://latest.currency-api.pages.dev/v1/currencies/usd.min.json',
                        pick: d => d.usd && { COP: d.usd.cop, PEN: d.usd.pen }
                    },
                    {
                        url: 'https://open.er-api.com/v6/latest/USD',
                        pick: d => d.result === 'success' && { COP: d.rates.COP, PEN: d.rates.PEN }
                    }
                ];

                for (const src of sources) {
                    try {
                        const response = await fetch(src.url, { cache: 'no-store' });
                        if (!response.ok) continue;
                        const r = src.pick(await response.json());
                        if (r && r.COP > 0 && r.PEN > 0) {
                            exchangeRates.COP = r.COP;
                            exchangeRates.PEN = r.PEN;
                            apiUsed = 'live';
                            break;
                        }
                    } catch (e) {
                        console.log('Rate source failed:', src.url, e);
                    }
                }
                
                // Fallback rates if API fails
                if (apiUsed === 'estimated') {
                    exchangeRates.COP = currencies.COP.fallbackRate;
                    exchangeRates.PEN = currencies.PEN.fallbackRate;
                }
                
                lastUpdated = new Date().toLocaleString();
                updateRateDisplay(apiUsed);
                convertCurrency();
                
            } catch (error) {
                console.error('Error fetching exchange rates:', error);
                
                // Use fallback rates
                exchangeRates.COP = currencies.COP.fallbackRate;
                exchangeRates.PEN = currencies.PEN.fallbackRate;
                lastUpdated = new Date().toLocaleString();
                
                updateRateDisplay('estimated');
                convertCurrency();
            }
        }

        // Update rate display
        function updateRateDisplay(apiStatus = 'estimated') {
            const statusText = apiStatus === 'live' ? 'Live rates' : 'Estimated rates';
            const statusColor = apiStatus === 'live' ? '#28a745' : '#ff6b35';
            
            rateInfo.innerHTML = `
                <strong>Exchange Rates:</strong><br>
                🇨🇴 1 USD = ${exchangeRates.COP.toLocaleString('en-US', { maximumFractionDigits: 2 })} COP<br>
                🇵🇪 1 USD = ${exchangeRates.PEN.toFixed(2)} PEN<br>
                <small style="color: ${statusColor};">${statusText} - ${lastUpdated}</small>
            `;
        }

        // Convert currency
        function convertCurrency() {
            const amount = parseFloat(amountInput.value) || 0;
            const rate = exchangeRates[currentCurrency];
            
            if (rate > 0 && amount >= 0) {
                const dollars = amount / rate;
                
                // Update display
                fromAmount.textContent = amount.toLocaleString();
                toAmount.textContent = `$${dollars.toLocaleString('en-US', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                })}`;
            } else {
                fromAmount.textContent = '0';
                toAmount.textContent = '$0.00';
            }
        }

        // Event listeners
        amountInput.addEventListener('input', convertCurrency);
        amountInput.addEventListener('keyup', convertCurrency);

        // Initialize
        fetchExchangeRates();

        // Auto-refresh rates every 10 minutes
        setInterval(fetchExchangeRates, 10 * 60 * 1000);
    </script>
</body>
</html>
